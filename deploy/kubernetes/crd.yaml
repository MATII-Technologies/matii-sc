apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: matiisecrets.secrets.matii.io
spec:
  group: secrets.matii.io
  scope: Namespaced
  names: { kind: MatiiSecret, plural: matiisecrets, singular: matiisecret, shortNames: [msec] }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: App, type: string, jsonPath: .spec.app }
        - { name: Env, type: string, jsonPath: .spec.env }
        - { name: Secret, type: string, jsonPath: .spec.secretName }
        - { name: Ready, type: boolean, jsonPath: .status.ready }
        - { name: Synced, type: date, jsonPath: .status.lastSyncTime }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [serviceAccountId, app, env, secretName]
              properties:
                serviceAccountId: { type: string, description: Matii service account with a Kubernetes OIDC identity }
                kubernetesServiceAccount: { type: string, default: default, description: ServiceAccount whose token is exchanged }
                app: { type: string }
                env: { type: string }
                path: { type: string }
                secretName: { type: string, pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$', maxLength: 253 }
                refreshSeconds: { type: integer, minimum: 15, default: 60 }
                rolloutRestart:
                  type: array
                  items:
                    type: object
                    required: [kind, name]
                    properties:
                      kind: { type: string, enum: [Deployment, StatefulSet, DaemonSet] }
                      name: { type: string }
            status:
              type: object
              properties:
                ready: { type: boolean }
                message: { type: string }
                secretHash: { type: string }
                lastSyncTime: { type: string }
                observedGeneration: { type: integer }
